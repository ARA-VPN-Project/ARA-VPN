<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
<title id="title">ARA VPN — ваш интернет, ваш маршрут</title><desc id="desc">Своя сеть для доступа к нужным сервисам: устройство подключается ко входной ноде, правила выбирают локальный или зарубежный выход.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#eef2f8"/></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#1769ff"/><stop offset="1" stop-color="#3353db"/></linearGradient></defs>
<rect width="1440" height="720" rx="32" fill="url(#bg)"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
<rect x="60" y="54" width="56" height="56" rx="17" fill="url(#blue)"/><path d="M75 94l13-29 13 29m-21-9h16" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="132" y="91" font-size="30" font-weight="750" fill="#141e31">ARA VPN</text><text x="60" y="173" font-size="14" letter-spacing="2.5" font-weight="700" fill="#4b648b">СВОЯ СЕТЬ · СВОИ ПРАВИЛА</text>
<text x="56" y="254" font-size="67" letter-spacing="-2.5" font-weight="750" fill="#111c30">Ваш интернет.</text><text x="56" y="333" font-size="67" letter-spacing="-2.5" font-weight="750" fill="#2463e8">Ваш маршрут.</text>
<text x="60" y="391" font-size="23" fill="#53637b">Доступ к нужным сервисам.</text><text x="60" y="426" font-size="23" fill="#53637b">Проходные ноды, понятные правила,</text><text x="60" y="461" font-size="23" fill="#53637b">одна подписка для пользователя.</text>
