<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="t d"><title id="t">Как работает ARA VPN</title><desc id="d">Пользователь подключается ко входной ноде; правила отправляют выбранные сервисы через один или несколько выходов, остальные через локальный выход. Внешний пул и строгий отказ выбираются явно.</desc><rect width="1280" height="430" rx="24" fill="#f5f8fc"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"><text x="42" y="58" font-size="28" font-weight="700" fill="#18263b">Один доступ. Несколько осмысленных маршрутов.</text>
<path d="M242 226h74m234 0h70M620 226v-75q0-20 20-20h153M620 226h173M620 226v76q0 20 20 20h153" fill="none" stroke="#a7bad7" stroke-width="3"/>
<rect x="42" y="175" width="200" height="103" rx="18" fill="white" stroke="#d9e3f0"/><text x="67" y="216" font-size="20" font-weight="700" fill="#22334c">Ваши устройства</text><text x="67" y="247" font-size="15" fill="#72819a">Одна подписка + QR</text>
<rect x="316" y="155" width="234" height="143" rx="18" fill="#eaf2ff" stroke="#bcd3fb"/><text x="341" y="195" font-size="20" font-weight="700" fill="#2056af">Входная нода</text><text x="341" y="226" font-size="16" fill="#536d95">Дома или на VPS</text><text x="341" y="257" font-size="15" fill="#536d95">Правила · доступ · лимиты</text>
<rect x="793" y="88" width="441" height="84" rx="16" fill="white" stroke="#d9e3f0"/><text x="818" y="121" font-size="19" font-weight="700" fill="#22334c">Нидерланды · выход A</text><text x="818" y="150" font-size="15" fill="#72819a">Например, видео и выбранные сервисы Google</text>
<rect x="793" y="184" width="441" height="84" rx="16" fill="white" stroke="#d9e3f0"/><text x="818" y="217" font-size="19" font-weight="700" fill="#22334c">Германия · выход B</text><text x="818" y="246" font-size="15" fill="#72819a">Например, ИИ-сервисы и другая группа правил</text>
<rect x="793" y="280" width="441" height="84" rx="16" fill="white" stroke="#d9e3f0"/><text x="818" y="313" font-size="19" font-weight="700" fill="#22334c">Локальный выход входной ноды</text><text x="818" y="342" font-size="15" fill="#72819a">Сайты, которым не нужен зарубежный маршрут</text><text x="42" y="397" font-size="14" fill="#7b8aa0">Пример политики, а не обязательная топология. DIRECT на устройстве настраивается отдельно.</text></g></svg>