name: Verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Verify pinned modules
        run: go mod verify
      - name: Test with race detector
        run: go test -race ./...
      - name: Build all commands
        run: go build ./cmd/...
      - name: Check installer syntax
        run: sh -n install.sh release/install.sh release/configure-panel.sh release/export-source.sh deploy/debian/build-deb.sh
